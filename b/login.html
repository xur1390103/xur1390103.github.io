<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册/登录 · 品牌有据</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/theme-b.css"><link rel="stylesheet" href="../assets/local-prototype.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><a class="brand-lockup" href="index.html">品牌<i>有据</i></a><div class="auth-tabs" role="tablist"><button class="auth-tab active" data-tab="login" role="tab">登录</button><button class="auth-tab" data-tab="register" role="tab">注册</button></div><p class="auth-message" id="message" role="status"></p>
<form class="auth-form" id="login"><label>练习账户<input name="username" autocomplete="username" placeholder="请输入练习账户" required></label><label>练习密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入练习密码" required></label><button class="auth-submit">登录并继续</button></form>
<form class="auth-form hidden" id="register"><label>练习账户<input name="username" autocomplete="username" placeholder="3–20 位字母、数字或 - _" required></label><label>练习密码<input name="password" type="password" autocomplete="new-password" placeholder="至少 6 位" required></label><label>确认密码<input name="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" required></label><button class="auth-submit">创建练习账户</button></form>
<p class="auth-footer"><a href="index.html">返回首页</a><span>·</span><span>本地练习，不连接公开网站</span></p>
</section></main><script src="../assets/local-auth.js"></script><script>
const message=document.querySelector('#message');function note(text,type=''){message.textContent=text;message.className=`auth-message ${type}`}
document.querySelectorAll('.auth-tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.auth-tab').forEach(item=>item.classList.toggle('active',item===tab));document.querySelectorAll('.auth-form').forEach(form=>form.classList.toggle('hidden',form.id!==tab.dataset.tab));note('');}));
document.querySelector('#register').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);if(form.get('password')!==form.get('confirmPassword'))return note('两次输入的密码不一致，请重新确认。');try{const data=await localApi('/api/register',{method:'POST',body:JSON.stringify(Object.fromEntries(form))});note(data.message,'success');document.querySelector('[data-tab="login"]').click();}catch(error){note(error.message);}});
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();try{await localApi('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget)))});redirectAfterLogin();}catch(error){note(error.message);}});
</script></body></html>
