<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册/登录 · 品牌有据</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/theme-b.css"><link rel="stylesheet" href="../assets/local-prototype.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><a class="brand-lockup" href="index.html">品牌<i>有据</i></a><div class="auth-tabs" role="tablist"><button class="auth-tab active" data-tab="login" role="tab">登录</button><button class="auth-tab" data-tab="register" role="tab">注册</button></div><p class="auth-message" id="message" role="status"></p>
<form class="auth-form" id="login"><label>邮箱<input name="email" type="email" autocomplete="email" placeholder="请输入注册邮箱" required></label><label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label><button class="auth-submit">登录并继续</button></form>
<form class="auth-form hidden" id="register"><label>显示名称<input name="displayName" autocomplete="nickname" placeholder="3–20 位字母、数字或 - _" required></label><label>邮箱<input name="email" type="email" autocomplete="email" placeholder="用于登录和验证" required></label><label>密码<input name="password" type="password" autocomplete="new-password" placeholder="至少 6 位" required></label><label>确认密码<input name="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" required></label><button class="auth-submit">创建账户</button></form>
</section></main><script src="../assets/local-auth.js"></script><script>
const message=document.querySelector('#message');function note(text,type=''){message.textContent=text;message.className=`auth-message ${type}`}
const verifyState=new URLSearchParams(location.search);
if(verifyState.get('verified')==='1')note('邮箱已验证，请使用刚才的邮箱和密码登录。','success');
if(verifyState.get('verify_error')==='1')note('验证链接已失效或已被使用。请联系管理员重新发送验证邮件，或确认该账户。');
document.querySelectorAll('.auth-tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.auth-tab').forEach(item=>item.classList.toggle('active',item===tab));document.querySelectorAll('.auth-form').forEach(form=>form.classList.toggle('hidden',form.id!==tab.dataset.tab));note('');}));
document.querySelector('#register').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);if(form.get('password')!==form.get('confirmPassword'))return note('两次输入的密码不一致，请重新确认。');try{const data=await localApi('/api/register',{method:'POST',body:JSON.stringify(Object.fromEntries(form))});if(data.needsEmailConfirmation)return note(data.message,'success');note(data.message,'success');document.querySelector('[data-tab="login"]').click();}catch(error){note(error.message);}});
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();try{await localApi('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget)))});redirectAfterLogin();}catch(error){note(error.message);}});
</script></body></html>
