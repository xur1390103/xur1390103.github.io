<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的草稿 · 品牌有据</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/theme-b.css"><link rel="stylesheet" href="../assets/local-prototype.css"></head>
<body><header><a class="logo" href="index.html">品牌<i>有据</i></a><nav><a href="index.html">返回首页</a><a href="checklist.html">继续填写提纲</a><span class="account-menu" data-account-menu><a class="account-link" data-login-link href="login.html">注册/登录</a><button class="account-trigger hidden" data-account-trigger type="button" aria-expanded="false"></button><span class="account-dropdown hidden" data-account-panel><a href="index.html#about">联系徐律师</a><button type="button" data-logout-button>退出登录</button></span></span></nav></header><main class="auth-shell"><section class="draft-summary"><h1>我的整理草稿</h1><p id="welcome" class="intro"></p><div id="empty" class="hidden"><p>还没有保存草稿。先填写提纲，再选择“保存草稿”。</p></div><dl id="summary" class="hidden"></dl><div class="local-actions"><a class="primary" href="index.html">返回首页</a><a class="secondary-button" href="checklist.html">继续填写提纲</a></div></section></main><script src="../assets/local-auth.js"></script><script>
const labels=['发现地点','所见内容','发现时间','自有资料','在意的结果','其他补充'];
(async()=>{try{const {user}=await localApi('/api/me');if(!user)return location.replace('login.html?next=/b/my-draft.html');document.querySelector('#welcome').textContent=`你好，${user.displayName}。以下是你保存的内容。`;const {draft}=await localApi('/api/draft');if(!draft)return document.querySelector('#empty').classList.remove('hidden');const list=document.querySelector('#summary');list.innerHTML=draft.fields.map((value,index)=>`<dt>${labels[index]}</dt><dd>${value||'（未填写）'}</dd>`).join('');list.classList.remove('hidden');}catch(error){location.replace('login.html?next=/b/my-draft.html');}})();
updateLocalAccountLink();
</script></body></html>
