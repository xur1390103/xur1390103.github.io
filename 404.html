<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 品牌有据</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;max-width:640px;margin:80px auto;padding:0 24px;color:#1c2b33;line-height:1.8}
  h1{font-size:28px;margin-bottom:12px}
  a{color:#1f5c4a}
  .muted{color:#6b7a72;font-size:14px}
</style>
</head>
<body>
<h1>页面不存在</h1>
<p id="msg">这个地址可能已经失效，或者链接不完整。</p>
<p><a href="/b/login.html">返回登录页</a> · <a href="/b/index.html">返回首页</a></p>
<p class="muted">品牌有据 · 课程练习版</p>
<script>
(function () {
  var hash = location.hash || '';
  var params = new URLSearchParams(location.search || '');
  var tokenHash = params.get('token_hash');
  var type = params.get('type') || 'signup';
  if (tokenHash) {
    document.getElementById('msg').textContent = '正在验证邮箱，请稍候…';
    fetch('/api/confirm?token_hash=' + encodeURIComponent(tokenHash) + '&type=' + encodeURIComponent(type))
      .then(function (res) { if (!res.ok) throw new Error('verify failed'); return res.json(); })
      .then(function () { location.replace('/b/login.html?verified=1'); })
      .catch(function () { location.replace('/b/login.html?verify_error=1'); });
    return;
  }
  if (hash.indexOf('access_token') !== -1 || hash.indexOf('type=signup') !== -1) {
    location.replace('/b/index.html' + hash);
    return;
  }
  if (hash.indexOf('error_description') !== -1) {
    location.replace('/b/login.html?verify_error=1');
  }
})();
</script>
</body>
</html>
